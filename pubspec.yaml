name: tom_kdbx_store
description: >-
  KDBX storage for Tom applications: a record store over a KDBX file (one entry
  per record, entry history, recycle-bin delete, reserved entries), an
  encrypted settings container with its key, token, location and identity
  groups, and the KDBX binding of tom_core_settings' key port. GPL-3.0.
version: 0.1.0
publish_to: none
repository: https://github.com/al-the-bear/tom_kdbx_store

environment:
  sdk: ^3.10.0

dependencies:
  # The KDBX format: `tom_kdbx`, the workspace's fork of authpass/kdbx.dart
  # 2.4.2, published on pub.dev. What it carries beyond upstream:
  #
  #   1. `KdbxObjectUuidControl.assignUuid` — a public UUID-assignment API, so
  #      entry UUID = record id can be set at creation without an
  #      implementation_imports src-import.
  #   2. `KdbxCustomData.remove` — the map-like surface had no removal, so a
  #      meta key could only be blanked. Webwork's `webwork.conflicts` must be
  #      able to disappear.
  #   3. `KdbxDao.clearDeletion` / `isDeleted` — a `DeletedObjects` record
  #      could be added and never removed. A record that returns after
  #      another client emptied the recycle bin must not stay recorded as
  #      deleted, or a client merging two copies deletes it again.
  #   4. `xml: '>=4.4.0 <8.0.0'` — upstream caps `xml` below 7, which kept
  #      every consumer off `pdf` 3.13 (it needs `xml` ^7.0.1).
  #
  # Return to upstream's `kdbx` once all four are upstreamed.
  #
  # The fork's source is `tom_ai/xternal/tom_kdbx` (repository
  # al-the-bear/tom_kdbx, branch `tom/2.4.2-patches`), checked out DETACHED at
  # the series head. To release a change: check out the branch, commit, bump
  # `version:` to the next `2.4.2+tom.N`, push, `dart pub publish`,
  # `git checkout --detach`, commit the moved gitlink in `tom_ai`, then raise
  # the constraint below. This is the only package that names the fork: every
  # Tom application reaches KDBX through this one (`test/supply_chain_test.dart`).
  tom_kdbx: ^2.4.2+tom.4
  meta: ^1.15.0
  # The canonical YAML emitter and reader for an asset entry's metadata.
  tom_basics: ">=3.3.0"
  # The key port, the secret-store port and device settings.
  tom_core_settings:
    path: ../core/tom_core_settings
  # The storage port a settings container is read and committed through.
  tom_core_storage:
    path: ../core/tom_core_storage
  # The history-store port the KDBX entry history implements.
  tom_core_sync:
    path: ../core/tom_core_sync

  # Reading an asset entry's metadata fragment.
  yaml: ^3.1.0

dev_dependencies:
  lints: ^6.0.0
  # The supply-chain test compares the resolved tom_kdbx version.
  pub_semver: ^2.1.0
  test: ^1.25.0
