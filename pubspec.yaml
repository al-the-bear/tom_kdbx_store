name: tom_kdbx_store
description: >-
  KDBX storage for Tom applications: a record store over a KDBX file (one entry
  per record, entry history, recycle-bin delete, reserved entries), an
  encrypted settings container with its key, token, location and identity
  groups, and the KDBX binding of tom_core_storage's key port.
version: 0.2.5
repository: https://github.com/al-the-bear/tom_kdbx_store

environment:
  sdk: ^3.10.0

dependencies:
  # The KDBX format: `tom_kpasslib`, the workspace's fork of kpasslib 1.1.2
  # (MIT), published on pub.dev. What it carries beyond upstream: it runs on
  # the web (dart2js), and the KDF parameters of a file can be set. The
  # package's own KDBX types (lib/src/kdbx_model.dart) are implemented over
  # it, so no consumer names the library.
  #
  # The fork's source is `tom_ai/xternal/tom_kpasslib` (repository
  # al-the-bear/tom_kpasslib, branch `tom/1.1.2-patches`), checked out DETACHED
  # at the series head. To release a change: check out the branch, commit,
  # bump `version:` to the next `1.1.2+tom.N`, push, publish through
  # `_bin/publishing/publish_staged.sh`, `git checkout --detach`, commit the
  # moved gitlink in `tom_ai`, then raise the constraint below. This is the
  # only package that names the fork (`test/supply_chain_test.dart`).
  tom_kpasslib: ^1.1.2+tom.3
  # Reading a key file the way the package always has (Credentials.keyFileKey):
  # an XML key file, and the SHA-256 of any other file.
  crypto: ^3.0.6
  xml: '>=6.2.2 <8.0.0'
  meta: ^1.15.0
  # The canonical YAML emitter and reader for an asset entry's metadata.
  tom_basics: ^3.3.0
  # The storage port a settings container is read and committed through.
  tom_core_storage:
    path: ../core/tom_core_storage
  # The history-store port the KDBX entry history implements.
  tom_core_sync:
    path: ../core_extension/tom_core_sync

  # Reading an asset entry's metadata fragment.
  yaml: ^3.1.0

dev_dependencies:
  lints: ^6.0.0
  # The supply-chain test compares the resolved tom_kpasslib version.
  pub_semver: ^2.1.0
  test: ^1.25.0
